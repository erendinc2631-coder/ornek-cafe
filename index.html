<html lang="tr">
<head>
<meta charset="utf-8">

<title>Odun &amp; Kahve Roastery – QR Menü</title>
<meta name="description" content="Odun &amp; Kahve Roastery: kış kafesi menüsü, masadan sipariş ve değerlendirme. Portföy örneği.">
<meta name="theme-color" content="#F7F3EB">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EB;--card:#FCF9F4;--line:#E6DDD0;--ink:#2A1D15;--muted:#6B5647;--amber:#C2763E;--btn:#A85F2C;--sage:#4F634B;--err:#9B2C2C;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:.9}
.top{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-family:"Playfair Display",serif;font-weight:700;font-size:20px;margin-right:auto}
.brand small{font:600 11px "Plus Jakarta Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.tb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
select,input[type=search],input[type=text],input[type=password],input[type=number],textarea{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;width:100%}
.tb select{width:auto}
textarea{min-height:76px;resize:vertical}
.btn{min-height:44px;border:0;border-radius:12px;padding:10px 18px;background:var(--btn);color:#fff;font-weight:700;cursor:pointer}
.btn.sage{background:var(--sage)}.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}.btn.err{background:var(--err)}
.ghost{min-height:44px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.ghost[aria-pressed="true"]{background:var(--sage);color:#fff;border-color:var(--sage)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #1F4E8C;outline-offset:2px}
.hero{padding-top:34px;padding-bottom:22px}
.amb{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;background:#E9EEE6;color:var(--sage);font-weight:700;font-size:13px}
.hero h1{font-size:clamp(30px,7vw,52px);max-width:18ch}
.hero p{color:var(--muted);max-width:52ch}
.help{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.tab{flex:none;min-height:44px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:8px 16px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}.srow input{flex:1 1 200px}
.grid{display:grid;gap:16px;grid-template-columns:1fr;padding:22px 0}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(90,60,30,.08)}
.card.out{opacity:.62}
.pic{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#E8C9A6,#C2763E);display:flex;align-items:center;justify-content:center}
.pic svg{width:64px;height:64px;color:#FCF9F4;opacity:.9}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}.pic img.on{opacity:1}
.badge{position:absolute;top:10px;left:10px;background:var(--sage);color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
.badge.o{left:auto;right:10px;background:var(--err)}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cb h3{font-size:19px}.pr{font-weight:700;color:var(--btn);white-space:nowrap}
.cb p{margin:0;color:var(--muted);font-size:14px}.ing{font-size:13px}.ing b{color:var(--ink)}
.rt{font-weight:700;font-size:14px}.rt i{color:var(--amber);font-style:normal}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}.acts .btn:first-child{flex:1}
.sec{padding:8px 0 22px}.sec h2{font-size:28px;margin-bottom:6px}.sec>p{color:var(--muted);margin:0 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:560px}
.stars{display:flex;gap:2px}.stars button{min-width:44px;min-height:44px;border:0;background:none;font-size:30px;line-height:1;color:#D9CFC2;cursor:pointer}.stars button.on{color:var(--amber)}
.fld{margin:12px 0 6px;font-weight:600}
footer{padding:26px 0 10px;text-align:center;color:var(--muted);font-size:14px}
.cartbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;min-height:54px;border-radius:28px;border:0;background:var(--ink);color:#fff;font-weight:700;padding:0 22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#bd{position:fixed;inset:0;background:rgba(42,29,21,.45);z-index:40;display:none}#bd.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:50;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.dh h2{font-size:24px}
.db{flex:1;overflow:auto;padding:14px 18px}.df{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li .n{flex:1}.li small{display:block;color:var(--muted)}
.q{display:flex;align-items:center;gap:4px}.q button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.x{border:0;background:none;color:var(--err);font-weight:700;cursor:pointer;min-height:40px;padding:0 6px}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(42,29,21,.55)}#modal.on{display:flex}
.mc{background:var(--bg);border-radius:22px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}.mc h2{font-size:25px;margin-bottom:8px}
.step{display:flex;gap:6px;margin:10px 0}.step span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:8px 2px;border-radius:10px;background:var(--line);color:var(--muted)}.step span.on{background:var(--sage);color:#fff}
.mine{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;max-width:560px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-weight:600;display:none;max-width:90vw;text-align:center}
#admin{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}#admin.on{display:block}
.ah{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}.ah h2{font-size:26px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mt{display:inline-block;background:var(--ink);color:#fff;font-weight:700;border-radius:8px;padding:2px 10px;margin-right:8px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--line)}.chip.new{background:#F3D9B1}.chip.prep{background:#D9E3D6}.chip.done{background:#CFE3EE}.chip.cancel{background:#EBC9C9}

.sg{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(min-width:700px){.sg{grid-template-columns:repeat(4,1fr)}}.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.st b{display:block;font:700 26px "Playfair Display",serif}.st span{color:var(--muted);font-size:13px}
.ep{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ep span{flex:1}.ep input[type=number]{width:96px}
.empty{color:var(--muted);padding:16px 0}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#drawer{transition:none}.pic img{transition:none}}
</style>
</head>

function prod(id){return P.filter(function(p){return p.id===id})[0]}
function price(p){return S.price[p.id]!=null?S.price[p.id]:p.price}
function rate(id){var p=prod(id),s=p.avg*p.cnt,c=p.cnt;S.pr.forEach(function(r){if(r.pid===id){s+=r.stars;c++}});return [c?s/c:0,c]}
function cartItems(){return Object.keys(S.cart).map(function(k){var p=prod(+k);return p&&S.cart[k]>0&&!S.out[p.id]?{pid:p.id,name:p.name,qty:S.cart[k],price:price(p)}:null}).filter(Boolean)}
function cartTotal(){return cartItems().reduce(function(a,i){return a+i.qty*i.price},0)}

var cv=$('#snow'),cx=cv.getContext('2d'),W=0,H=0,F=[],raf=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(var i=0;i<60;i++)F.push({x:Math.random()*1000,y:Math.random()*1000,r:1.8+Math.random()*2.8,s:.25+Math.random()*.55,d:Math.random()*6});
function snowLoop(){cx.clearRect(0,0,W,H);if(!S.snow){raf=0;return}
  cx.fillStyle='rgba(255,255,255,.95)';cx.strokeStyle='rgba(120,140,165,.55)';cx.lineWidth=1;F.forEach(function(f){f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.3;if(f.y>H){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x%W,f.y,f.r,0,6.28);cx.fill();cx.stroke()});raf=requestAnimationFrame(snowLoop)}
function snowSet(){cv.style.display=S.snow?'block':'none';if(S.snow&&!raf)raf=requestAnimationFrame(snowLoop)}

/* ---- OLAYLAR ---- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),id=+el.getAttribute('data-id'),i=+el.getAttribute('data-i');
  if(a==='cat'){ui.cat=+el.getAttribute('data-c');ui.q='';$('#q').value='';renderNav();renderMenu()}
  else if(a==='flt'){var k=el.getAttribute('data-k');ui.f[k]=!ui.f[k];renderNav();renderMenu()}
  else if(a==='add'){if(S.out[id])return;S.cart[id]=(S.cart[id]||0)+1;save();renderCartBtn();toast(prod(id).name+' sepete eklendi')}
  else if(a==='inc'){S.cart[id]=(S.cart[id]||0)+1;save();renderDrawer();renderCartBtn()}
  else if(a==='dec'){S.cart[id]=Math.max(0,(S.cart[id]||0)-1);save();renderDrawer();renderCartBtn()}
  else if(a==='del'){delete S.cart[id];save();renderDrawer();renderCartBtn()}
  else if(a==='cartopen')openDrawer();
  else if(a==='close')closeDrawer();
  else if(a==='order')order();
  else if(a==='mclose')mclose();
  else if(a==='snowt'){S.snow=!S.snow;save();snowSet()}
  else if(a==='call'){var t=el.getAttribute('data-t');
    if(!S.table){toast('Önce üstten masanızı seçin');$('#tblTop').focus();return}
    if(S.calls.some(function(c){return c.table===S.table&&c.type===t})){toast('Talebiniz zaten iletildi, birazdan yanınızdayız');return}
    S.calls.push({table:S.table,type:t,t:Date.now()});save();toast(t==='hesap'?'Hesap isteğiniz iletildi':'Garson çağrınız iletildi');if(adm.open)renderAdmin()}
  else if(a==='vote'){var pv=myVote(id);vote={pid:id,stars:pv?pv.stars:0};modal('<h2>'+esc(prod(id).name)+'</h2><p>Bu ürünü nasıl buldunuz?</p><div class="stars" id="vs">'+starHtml('vote',vote.stars)+'</div>'+(pv?'<p style="font-size:13px;color:var(--muted)">Bu ürüne daha önce oy verdiniz; yeni oyunuz eskisinin yerine geçer.</p>':'')+'<label class="fld" for="vt">Kısa yorum (isteğe bağlı)</label><textarea id="vt" maxlength="300">'+esc(pv?pv.text:'')+'</textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-a="vsend" style="flex:1">Gönder</button><button class="btn line" data-a="mclose">Vazgeç</button></div>')}
  else if(a==='star'){var g=el.getAttribute('data-g'),v=+el.getAttribute('data-v');
    if(g==='vote')vote.stars=v;else sv[g]=v;
    [].forEach.call(el.parentElement.children,function(b,n){b.classList.toggle('on',n<v)})}
  else if(a==='vsend'){if(!vote.stars){toast('Lütfen yıldız seçin');return}
    var nv={pid:vote.pid,stars:vote.stars,text:$('#vt').value.trim(),t:Date.now(),dev:dev()},ov=myVote(vote.pid);if(ov)S.pr[S.pr.indexOf(ov)]=nv;else S.pr.push(nv);save();mclose();renderMenu();toast('Değerlendirmeniz için teşekkürler')}
  else if(a==='svsend'){
    if(!S.table){toast('Lütfen masanızı seçin');$('#tblSv').focus();return}
    if(!sv.staff||!sv.amb){toast('Her iki başlık için de yıldız seçin');return}
    S.sr.push({table:S.table,staff:sv.staff,amb:sv.amb,text:$('#svt').value.trim(),t:Date.now()});save();sv={staff:0,amb:0};$('#svt').value='';
    $('#sv-staff').innerHTML=starHtml('staff',0);$('#sv-amb').innerHTML=starHtml('amb',0);toast('Geri bildiriminiz için teşekkür ederiz')}
  else if(a==='adminopen')modal('<h2>Yönetici Girişi</h2><label class="fld" for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"><p style="font-size:13px;color:var(--muted)">Demo PIN: 1234</p><div style="display:flex;gap:8px"><button class="btn" data-a="pinok" style="flex:1">Giriş</button><button class="btn line" data-a="mclose">Vazgeç</button></div>');
  else if(a==='pinok'){if($('#pin').value==='1234'){mclose();adm.open=true;adm.tab=0;renderAdmin()}else toast('PIN hatalı')}
  else if(a==='adminclose'){adm.open=false;renderAdmin()}
  else if(a==='atab'){adm.tab=i;renderAdmin()}
  else if(a==='st'){S.orders[i].status=el.getAttribute('data-s');save();renderAdmin();renderMine()}
  else if(a==='callok'){S.calls.splice(i,1);save();renderAdmin()}
  else if(a==='delpr'){S.pr.splice(i,1);save();renderAdmin();renderMenu()}
  else if(a==='delsr'){S.sr.splice(i,1);save();renderAdmin()}
  else if(a==='out'){S.out[id]=!S.out[id];save();renderAdmin();renderMenu();renderCartBtn()}
});
